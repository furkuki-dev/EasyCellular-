name: EasyCellular

options:
  bundleIdPrefix: com.werty
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EasyCellular:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EasyCellular
        excludes:
          - Info.plist
    info:
      path: EasyCellular/Info.plist
      properties:
        CFBundleDisplayName: EasyCellular
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.werty.easycellular
        PRODUCT_NAME: EasyCellular
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EasyCellular/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  EasyCellular:
    build:
      targets:
        EasyCellular: all
