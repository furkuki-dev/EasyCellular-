name: Build IPA and APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release)
        run: |
          xcodebuild \
            -project EasyCellular.xcodeproj \
            -scheme EasyCellular \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=build/Build/Products/Release-iphoneos/EasyCellular.app
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr EasyCellular.ipa Payload
          rm -rf Payload

      - name: Pass IPA to release job
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/EasyCellular.ipa
          retention-days: 1

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 37 (Android 17)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EasyCellular.apk

      - name: Pass APK to release job
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/EasyCellular.apk
          retention-days: 1

  release:
    name: Publish release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -la dist

      - name: Create release with raw .ipa and .apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EasyCellular build #${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/EasyCellular.ipa
            dist/EasyCellular.apk
